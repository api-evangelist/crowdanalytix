aid: crowdanalytix
name: CrowdAnalytix
description: 'CrowdAnalytix (CAX) is a crowdsourced data science and predictive analytics platform
  that connects enterprises with a global community of data scientists to build, test, and compare
  machine learning models through hosted modeling competitions. The company runs prediction and
  classification contests across industries such as consumer packaged goods, retail, banking,
  insurance, and healthcare, and has extended into AI/ML model development, data annotation and
  labeling, and packaged AI solutions. Headquartered in Frisco, Texas with operations in Bangalore,
  India, CrowdAnalytix is backed by Accel.'
